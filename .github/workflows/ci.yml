name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-buzz/package-lock.json
      - name: Tests du serveur
        working-directory: quiz-buzz
        run: |
          npm ci
          npm test
      - name: Validation des quiz
        run: python3 questions/build.py --check
      - name: Syntaxe des scripts de déploiement
        run: for f in deploiement/*.sh deploiement/outils/*.sh; do bash -n "$f"; done

  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image quiz-buzz
        run: docker build -f quiz-buzz/Dockerfile -t hardening-arena:ci .
